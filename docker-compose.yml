# Local development stack: Postgres + API, no host installs needed.
#   docker compose up --build      -> API on http://localhost:8000
# Production uses the same backend/Dockerfile with a hosted Supabase database.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gymlock
      POSTGRES_PASSWORD: gymlock
      POSTGRES_DB: gymlock_dev
    ports:
      - "5433:5432"
    volumes:
      - gymlock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymlock -d gymlock_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://gymlock:gymlock@db:5432/gymlock_dev
      JWT_SECRET: dev-only-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  gymlock_pgdata:
